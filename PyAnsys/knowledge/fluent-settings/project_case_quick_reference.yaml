project: geothermal_separator_two_phase_inlet
known_boundaries:
  - steaminlet
  - liquidinlet
  - steamoutlet
  - bottom
  - wall
likely_phases:
  primary: water-vapor
  secondary: water-liquid
models_of_interest:
  - Multiphase
  - Discrete Phase Model
  - Eulerian Wall Film
  - Energy
recommended_staging:
  - carrier multiphase setup and solve first
  - DPM global settings second
  - DPM default injection creation third
  - DPM injection modifications after default creation and reacquire
  - EWF only after basic DPM works
  - Energy only if thermal/phase-change model is genuinely required
injections:
  - name: dpm-5um
    diameter_m: 5.0e-6
    total_flow_rate_kg_s: 1.0e-6
    target_surface: steaminlet
  - name: dpm-10um
    diameter_m: 1.0e-5
    total_flow_rate_kg_s: 1.0e-6
    target_surface: steaminlet
  - name: dpm-14.2um
    diameter_m: 1.42e-5
    total_flow_rate_kg_s: 1.0e-6
    target_surface: steaminlet
  - name: dpm-41um
    diameter_m: 4.1e-5
    total_flow_rate_kg_s: 1.0e-6
    target_surface: steaminlet
known_failures:
  - symptom: dpm_*_location FAILED -> wta(1st) to string->symbol
    suspected_causes:
      - wrong setter format
      - injection type not surface before binding
      - object not reacquired after setting injection type
      - PyFluent/gRPC wrapper issue
    recommended_response:
      - create default injection first
      - set particle type and injection type sequentially
      - reacquire object between steps
      - inspect available surfaces
      - try TUI fallback
      - log manual fix if still failing
  - symptom: water-droplet material creation under inert_particle fails
    suspected_causes:
      - material category not active before DPM/default injection
      - wrong material category
      - object not reacquired after particle type inert
    recommended_response:
      - enable DPM
      - create default injection
      - set particle type inert
      - reacquire
      - inspect inert material category/options
      - create/copy water-like inert material if possible
