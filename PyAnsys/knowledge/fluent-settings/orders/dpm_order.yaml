name: dpm_order
core_warning: "Create default injection first, then modify. Do not force type/material/surface all at creation time."
order:
  - ensure_carrier_field_exists_or_is_initialized
  - enable_discrete_phase_model
  - refresh_dpm_tree
  - verify_interaction_state_before_carrier_solve:
      replication_default: one-way / interaction disabled
      rule: fail unless coupled DPM is an explicitly documented sensitivity
  - set_global_interaction:
      examples:
        - interaction with continuous phase
        - source update interval
  - set_particle_treatment:
      examples:
        - steady/unsteady tracking
        - particle/fluid timestep injection timing
        - particle timestep size
        - number of timesteps
  - set_tracking_options:
      examples:
        - max steps
        - step length factor
        - high-res tracking
        - accuracy control
        - tolerance
        - tracking scheme
  - set_global_physical_models:
      examples:
        - Saffman lift
        - virtual mass
        - pressure gradient force
        - erosion/accretion
        - DEM collision
        - stochastic collision
        - breakup
        - volume displacement
  - create_or_verify_dpm_material_category
  - for_each_injection:
      - create_default_injection_with_minimum_valid_arguments
      - refresh_reacquire_injection_object
      - set_particle_type
      - refresh_reacquire_injection_object
      - assign_particle_material
      - readback_material
      - set_injection_type_surface
      - refresh_reacquire_injection_object
      - inspect_available_surfaces
      - bind_injection_surface
      - readback_surface_or_location
      - set_point_properties:
          - velocity components
          - diameter
          - total flow rate
          - start/stop time
          - temperature if Energy on
      - set_surface_options:
          - scale by face area
          - use face normal
          - randomize starting points
      - set_injection_physical_models:
          - drag law
          - rough wall model
          - particle rotation
      - set_turbulent_dispersion
      - set_parcel_options
      - readback_all_properties
  - before_tracking:
      - enable per-injection and per-zone summaries
      - verify the report command succeeded
  - run_dpm_update:
      - treat update failure as fatal
      - do not parse a prior report after a failed update
  - export_per_injection_extended_summaries:
      - remove prior scratch report first
      - require a newly readable report for every injection
      - parse the labeled Final mass-flow column
      - retain escaped, trapped, and incomplete separately
      - reconcile fate mass against injected mass
  - preserve_post_tracking_state:
      - read and validate injection definitions without reapplying them
      - save post-DPM case and data only after report and fate-mass checks pass
hidden_dependencies:
  - DPM material categories may not appear until DPM is enabled
  - inert material list may not be valid until Particle Type = Inert and injection object is reacquired
  - Injection Surfaces are meaningful only after Injection Type = surface
  - droplet/evaporation laws require Particle Type = Droplet and usually Energy/species support
  - wallfilm injection options require EWF/DPM coupling
  - per-injection zone reporting must be enabled before particle tracking
  - particle counts are not generally valid mass fractions
  - face-normal direction uses a positive magnitude; the surface normal supplies direction
known_project_case:
  injections:
    dpm-5um: {diameter_m: 5.0e-6, total_flow_rate_kg_s: 1.0e-6, target_surface: steaminlet}
    dpm-10um: {diameter_m: 1.0e-5, total_flow_rate_kg_s: 1.0e-6, target_surface: steaminlet}
    dpm-14.2um: {diameter_m: 1.42e-5, total_flow_rate_kg_s: 1.0e-6, target_surface: steaminlet}
    dpm-41um: {diameter_m: 4.1e-5, total_flow_rate_kg_s: 1.0e-6, target_surface: steaminlet}
