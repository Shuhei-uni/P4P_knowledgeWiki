name: eulerian_wall_film_order
recommendation: "Enable only after carrier field and basic DPM are working."
order:
  - decide_if_EWF_is_needed
  - enable_Energy_first_if_film_heat_transfer_evaporation_or_boiling_needed
  - ensure_wall_boundaries_exist
  - enable_Eulerian_Wall_Film
  - refresh_EWF_tree
  - set_base_wall_film_options:
      - film momentum
      - gravity-driven motion
      - shear-driven motion
      - surface tension/contact angle if exposed
  - if_Energy_on_set_thermal_film_options:
      - film temperature
      - film heat transfer
      - evaporation
      - boiling
  - if_DPM_coupling_needed_enable_DPM
  - refresh_DPM_EWF_and_wall_boundary_trees
  - set_DPM_wall_interaction:
      - trap/reflect/escape/wall-film
      - particle-to-film transition
  - set_wall_boundary_film_settings:
      - film condition
      - initial film thickness
      - film velocity
      - film temperature if Energy on
      - contact angle/adhesion
  - set_solution_controls_for_wall_film_equations
  - initialize_film_variables_if_needed
hidden_dependencies:
  - wall-film tabs on wall boundaries appear only after EWF is enabled
  - film thermal/evaporation settings require Energy
  - DPM-to-wall-film coupling requires both DPM and EWF
  - injection wallfilm options require compatible DPM injection/wall-film coupling
