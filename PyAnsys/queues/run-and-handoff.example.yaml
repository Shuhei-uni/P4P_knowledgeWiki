job:
  id: S4-EXAMPLE
  mode: hypothesis-test
  manifest: PyAnsys/output/run-handoff/S4-EXAMPLE/job_manifest.json
  worker_log: PyAnsys/output/run-handoff/S4-EXAMPLE/worker.log

runner:
  # Use the exact approved Python/PyFluent hypothesis-test runner.
  # Keep this as an argv list: no shell string and no hidden fallback mechanism.
  command:
    - PyAnsys/.venv/Scripts/python.exe
    - PyAnsys/scripts/setup/run_example_20k.py
  cwd: .
  log: PyAnsys/output/run-handoff/S4-EXAMPLE/runner.log

completion:
  # Use local paths when this worker can see the files directly.
  required_files:
    - path: PyAnsys/output/run-handoff/S4-EXAMPLE/final.cas.h5
      min_size_bytes: 1
    - path: PyAnsys/output/run-handoff/S4-EXAMPLE/final.dat.h5
      min_size_bytes: 1

  # Optional: for remote Fluent paths, point this at an existing deterministic
  # verifier that returns 0 only when the declared remote outputs are verified.
  # verifier_command:
  #   - PyAnsys/.venv/Scripts/python.exe
  #   - PyAnsys/scripts/inspection/verify_example_final.py
  # verifier_cwd: .
  # verifier_log: PyAnsys/output/run-handoff/S4-EXAMPLE/verifier.log

codex:
  # Hypothesis-test jobs automatically enable the wakeup hook. The launcher
  # captures CODEX_THREAD_ID from the Codex process that starts this job, so a
  # session_id normally should not be copied manually into the file.
  # session_id: OPTIONAL_EXPLICIT_OVERRIDE
  executable: codex
  cwd: .
  trigger_on:
    - COMPLETE
    - BLOCKED
  log: PyAnsys/output/run-handoff/S4-EXAMPLE/codex_handoff.log
  prompt: >-
    The hypothesis-test Fluent simulation has terminated. Read the job manifest
    and the canonical Project experiment packet. If COMPLETE, perform the
    required post-processing and continue the scientific phase loop immediately.
    If BLOCKED, diagnose the execution failure from the preserved evidence and
    choose the appropriate recovery or redesign path. Do not wait for a human
    prompt and do not blindly rerun the same job.
