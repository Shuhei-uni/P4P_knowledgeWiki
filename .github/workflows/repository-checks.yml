name: Repository checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install offline test dependency
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Offline unit tests
        run: python -m unittest discover -s PyAnsys/tests
      - name: Active Markdown links
        run: python scripts/check_stale_paths.py --fail-on-missing
      - name: Calculation example
        working-directory: PyAnsys/scripts/analysis/droplet_calculations
        run: python steam_quality_calculation.py steam_quality_input_template.csv --incomplete separated
