name: P4P PyFluent MCP migration
on:
  push:
    branches: [codex/pyfluent-mcp-migration]
  pull_request:
    paths: ['PyAnsys/**', '.agents/**', 'AGENTS.md', '.github/workflows/pyfluent-mcp.yml']
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONPATH: PyAnsys/src
      FLUIDS_MCP_DISABLE_SESSION_LOGS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'PyAnsys/requirements*.txt'
      - run: python -m pip install -r PyAnsys/requirements-minimal.txt pytest
      - run: python -m compileall -q PyAnsys/src PyAnsys/scripts
      - run: python -m pytest PyAnsys/tests -q --junitxml=mcp-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-tests-${{ matrix.os }}
          path: mcp-tests.xml
