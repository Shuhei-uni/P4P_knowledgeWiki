# 11. RELEASE CHECKLIST
# ---------------------------------------------------------------------------

release_checklist:
  P0:
    - "pre-initialization only"
    - "all frozen physical/numerical settings verified"
    - "all Stage-3 monitors present"
    - "monitor smoke test passed on disposable copy"
    - "fresh-session reload verified"
    - "fingerprint + readback + SHA256 written"
    - "immutable P0 placed in the OneDrive Stage-3 parent root"
    - "no run-specific artifacts stored beside P0"
  local_seeds:
    - "derived only from a verified local copy of P0"
    - "uninitialized"
    - "only M/S startup deltas applied"
    - "fresh-session reload verified when persisted"
    - "kept local only"
  branches:
    - "derived from the correct local seed/state"
    - "only U delta applied before initialization"
    - "readback verified"
    - "case identity independent of server assignment"
    - "all checkpoints/autosaves/transcripts/results kept local"
    - "stage3-gate-v1 used without branch-specific threshold changes"