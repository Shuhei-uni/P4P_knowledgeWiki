    status: PASS_WITH_LIMITS
    evidence:
      - Project/experiments/phase-07-1a-absorber-convergence/v2-inlet-loading-ramp/results.md
      - PyAnsys/output/phase71a_v2_inlet_loading/20260922T031500Z/report-histories.json
      - PyAnsys/output/phase71a_v2_inlet_loading/20260922T031500Z/residuals.json
    limits:
      - finite-horizon trajectory is nonstationary with increasing total liquid inventory
      - persistent pressure-outlet reverse flow remains
      - no physical absorber or plant-drainage claim is authorized
  N1_PREFLIGHT:
    status: BLOCKED_EXTERNAL
    checked_at: 2026-09-22
    evidence:
      - Project/experiments/phase-07-1a-absorber-convergence/solver-improvement-family/n1-coupled-global-pseudo-time/results.md
      - Project/experiments/phase-07-1a-absorber-convergence/solver-improvement-family/n1-coupled-global-pseudo-time/run-paths.yaml
    limits:
      - recorded student endpoint was unavailable to the read-only status probe
      - reachable server-1 endpoint did not contain the exact v2 parent pair
      - no Fluent session was mutated and no solver iteration was run
  PHASE_CLOSURE:
    status: BLOCK
    missing:
      - discovery and qualification evidence do not exist

active_jobs: []
queue:
  - order: 1
    setup_id: P71A-V2-INLET-LOADING-RAMP
    status: COMPLETE_WITH_LIMITS
    exact_parent: P71A-BASELINE-V2-VIRTUAL-OUTLET prepared pair
    objective: >-
      Develop liquid from the freshly initialized field and determine whether
      native applied phase-2 removal tracks the inlet-derived command without
      direct vapor deletion; result is finite-horizon evidence only.
  - order: 2
    setup_id: P71A-V2-SOLVER-IMPROVEMENT-FAMILY
    status: READY_BUT_ENDPOINT_BLOCKED
    parent: P71A-BASELINE-V2-VIRTUAL-OUTLET prepared pair
    objective: >-
      Test the smallest solver-treatment improvement first: steady Coupled
      plus Global Time Step with automatic pseudo-time controls, while keeping
      the v2 absorber, loading ramp, and all physical settings fixed.
  - order: 3
    setup_id: P71A-V2-ROUGHNESS-FAMILY
    status: DESIGN_SELECTED_NOT_RUN
    server_id: server-1
    parent: P71A-BASELINE-V2-VIRTUAL-OUTLET prepared pair
    objective: >-
      Test whether increasing wall roughness with EWF off changes near-wall
      liquid trajectory and lower-region routing under the common v2 inlet ramp.
  - order: 4
    setup_id: P71A-V2-EWF-FAMILY
    status: DESIGN_SELECTED_NOT_RUN
    server_id: server-3
    parent: P71A-BASELINE-V2-VIRTUAL-OUTLET prepared pair
    objective: >-
      Test whether explicit Eulerian wall-film formation and phase accretion
      create downward wall-attached liquid routing under the common v2 inlet ramp.

historical_evidence:
  rule: >-
    Earlier Phase 7.1A directories containing results.md remain historical
    evidence. Their absorber and C7/C8 direction are not active v2 authority.
  removed_setup_records_without_results:
