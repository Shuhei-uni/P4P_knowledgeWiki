phase_id: phase-07-1a-absorber-convergence
phase_question: >-
  Can the 60k-mesh phase-2 virtual liquid outlet realize the commanded liquid
  inlet throughput while preserving credible phase routing, source-inclusive
  mass closure, bounded inventory behaviour, and useful steady convergence?
state: DISCOVERY_COMPLETE

planning_state: NUMERICAL_IMPROVEMENT_FAMILY_DESIGN_SELECTED

context:
  path: Project/experiments/phase-07-1a-absorber-convergence/CONTEXT.md
  authority: direct human reframe on 2026-09-22
  active_baseline: P71A-BASELINE-V2-VIRTUAL-OUTLET
  setup_path: Project/experiments/phase-07-1a-absorber-convergence/baseline-v2-virtual-liquid-outlet/deffered.md
  results_path: Project/experiments/phase-07-1a-absorber-convergence/baseline-v2-virtual-liquid-outlet/results.md
  manifest_path: Project/experiments/phase-07-1a-absorber-convergence/baseline-v2-virtual-liquid-outlet/build-manifest.json
  runtime: student
  latest_discovery_setup: Project/experiments/phase-07-1a-absorber-convergence/v2-inlet-loading-ramp/deffered.md
  latest_discovery_results: Project/experiments/phase-07-1a-absorber-convergence/v2-inlet-loading-ramp/results.md
  latest_discovery_manifest: PyAnsys/output/phase71a_v2_inlet_loading/20260922T031500Z/run-manifest.json
  active_family_screen: Project/experiments/phase-07-1a-absorber-convergence/solver-improvement-family/index.md
  mechanism_family_screen: Project/experiments/phase-07-1a-absorber-convergence/v2-mechanism-family-screen/index.md
  solver_improvement_family: Project/experiments/phase-07-1a-absorber-convergence/solver-improvement-family/index.md
  roughness_family: Project/experiments/phase-07-1a-absorber-convergence/roughness-family/index.md
  ewf_family: Project/experiments/phase-07-1a-absorber-convergence/ewf-family/index.md

baseline_loading_rule:
  start_multiplier: 0.25
  end_multiplier: 1.0
  ramp_active_iterations: 2000
  update_interval_iterations: 10
  liquid_base_target_kg_s: 116.92
  steam_base_target_kg_s: 80.69
  applies_to: baseline, solver-improvement-family, roughness-family, ewf-family
  qualification_status: discovery_loading_rule_only

baseline_v2:
  status: READY
  mesh_source: OneDrive-TheUniversityofAuckland/2026 Sem 2/700/Purnanto-new/Separator-purnanto-60k.msh.h5
  total_fluid_cells: 60964
  parent_cells: 60249
  virtual_outlet_cells: 715
  virtual_outlet_zone: p71a-v2-virtual-outlet
  prepared_case_sha256: 294970443203f9c21c054c86406316a935baf65df0ee4ebe2132ca93022989e4
  prepared_data_sha256: b77c63cdcadbf5346029823a493ebac599177bd4f19014d858cc611649355d12
  canonical_loaded_state: freshly hybrid-initialized prepared pair
  build_smoke: PASS_ONE_ITERATION
  scientific_performance: TESTED_DISCOVERY_ONLY

absorber_contract:
  command: absolute phase-2 liquid-inlet mass flow
  distribution: local phase-2 volume fraction normalized by lower-zone liquid volume
  volume_floor_m3: 1.0e-6
  direct_phase1_mass_source: false
  phase2_mass_source: true
  matched_liquid_momentum_removal: true
  shared_k_epsilon_removal: true
  update_interval_iterations: 1
  success_metric: commanded versus native applied phase-2 removal
  starvation_metric: lower-zone available liquid volume

gates:
  PHASE_CONTRACT:
    status: PASS
    checked_at: 2026-09-22
    evidence:
      - Project/experiments/phase-07-1a-absorber-convergence/CONTEXT.md
      - Project/experiments/phase-07-1a-absorber-convergence/baseline-v2-virtual-liquid-outlet/deffered.md
  BASELINE_BUILD:
    status: PASS
    checked_at: 2026-09-22
    evidence:
      - Project/experiments/phase-07-1a-absorber-convergence/baseline-v2-virtual-liquid-outlet/build-manifest.json
      - Project/experiments/phase-07-1a-absorber-convergence/baseline-v2-virtual-liquid-outlet/results.md
  DISCOVERY_DESIGN:
    status: PASS
    evidence:
      - Project/experiments/phase-07-1a-absorber-convergence/v2-inlet-loading-ramp/deffered.md
      - Project/experiments/phase-07-1a-absorber-convergence/v2-inlet-loading-ramp/run-paths.yaml
  DISCOVERY_EXECUTION:
    status: PASS
    evidence:
      - PyAnsys/output/phase71a_v2_inlet_loading/20260922T031500Z/run-manifest.json
      - PyAnsys/output/phase71a_v2_inlet_loading/20260922T031500Z/transcript.txt
